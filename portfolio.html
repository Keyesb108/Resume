    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-mono);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 40px 20px 80px 20px;
    }

    .container {
        width: 100%;
        max-width: 860px;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 50px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 20px;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: bold;
        font-size: 1rem;
        letter-spacing: 1.5px;
        text-decoration: none;
        color: var(--text-main);
        text-transform: uppercase;
    }

    .logo-icon {
        width: 12px;
        height: 12px;
        background: currentColor;
        display: inline-block;
    }

    nav {
        display: flex;
        gap: 20px;
    }

    nav a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    nav a:hover {
        color: var(--text-main);
        text-decoration: underline;
    }

    h1 {
        font-size: 2.5rem;
        margin-bottom: 40px;
        font-weight: 400;
    }

    .project-card {
        border: 1px solid var(--border-color);
        padding: 25px;
        background: #ebe9e1;
        margin-bottom: 40px;
